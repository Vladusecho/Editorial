name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  checks: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================================================================
      # 1. ПРОВЕРКА: Прошли ли тесты для этого коммита ранее?
      # =========================================================================
      - name: Verify that CI tests passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Проверяем статус проверок для коммита ${{ github.sha }}..."

          # Ищем результат проверки джобы с именем "test"
          CONCLUSION=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
            --jq '.check_runs[] | select(.name == "test") | .conclusion' | head -n 1)

          echo "Статус завершения тестов: '$CONCLUSION'"

          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ ОШИБКА: Тесты для этого коммита НЕ пройдены!"
            echo "Текущий статус: ${CONCLUSION:-'тесты еще не запускались или еще идут'}"
            echo "Деплой остановлен. Дождитесь зеленой галочки в CI."
            exit 1
          fi

          echo "✅ Тесты успешно пройдены ранее! Переходим к сборке и деплою..."

      # =========================================================================
      # 2. СБОРКА ПРОЕКТА
      # =========================================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR with Maven
        run: mvn -B package -DskipTests

      # =========================================================================
      # 3. ПОДГОТОВКА И ПУШ DOCKER-ОБРАЗА
      # =========================================================================
      # Формируем корректное имя образа в нижнем регистре: ghcr.io/owner/editorial-prod:latest
      - name: Prepare Docker Image Name
        run: |
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository_owner }}/editorial-prod:latest" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=$IMAGE_LOWER" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      # =========================================================================
      # 4. ДЕПЛОЙ НА СЕРВЕР ПО SSH
      # =========================================================================
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE
          script: |
            # Логинимся в реестр GitHub на самом сервере
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Скачиваем обновленный образ
            docker pull $IMAGE

            # Останавливаем старый контейнер, если он существует
            docker stop my-app || true
            docker rm my-app || true

            # Запускаем новый контейнер
            docker run -d \
              --name my-app \
              --restart unless-stopped \
              -p 6767:6767 \
              $IMAGE

            # Очищаем старые ненужные слои
            docker image prune -f
