name: Pipeline

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 1. ТЕСТЫ (Запускаются всегда первыми)
  # =========================================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

  # =========================================================================
  # 2. ДЕПЛОЙ (Соединен с тестами, ждет кнопку подтверждения)
  # =========================================================================
  deploy:
    name: Deploy to Server
    needs: test
    environment: production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR and Dependencies
        run: mvn -B package dependency:copy-dependencies -DoutputDirectory=target/dependency -DincludeScope=runtime -DskipTests

      - name: Prepare Docker Image Name
        run: |
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository_owner }}/editorial-prod:latest" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=$IMAGE_LOWER" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull $IMAGE
            docker stop editorial-app || true
            docker rm editorial-app || true
            docker run -d \
              --name editorial-app \
              --restart unless-stopped \
              -p 6767:6767 \
              $IMAGE
            docker image prune -f
